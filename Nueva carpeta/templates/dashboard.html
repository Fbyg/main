<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "JetBrains Mono", monospace;
        }

        :root {
            --bg: #f5f5f5;
            --text: #111111;
            --nav-bg: rgba(255, 255, 255, 0.7);
            --nav-border: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }

        body.dark {
            --bg: #0f1115;
            --text: #ffffff;
            --nav-bg: rgba(8, 8, 68, 0.7);
            --nav-border: rgba(255, 255, 255, 0.1);
            --card-bg: #1a1d24;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s ease;
        }

        nav {
            width: 100%;
            height: 70px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--nav-border);
            position: fixed;
            top: 0;
            left: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            transition: 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 1px;
            background: var(--text);
            transition: 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 70px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.301);
            transition: 0.3s ease;
        }

        p {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--text);
        }

        .theme-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .theme-btn:hover {
            background: #2e2546;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Dashboard</div>
        <div class="nav-links">
            <a href="#">Inicio</a>
            <a href="#">Perfil</a>
            <a href="#">Configuración</a>
            <a href="/logout">Cerrar sesión</a>
            <button id="themeToggle" class="theme-btn">🌙</button>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <p>Bienvenido/a {{ user.email }}</p>
        </div>
    </div>
    <script>
        const btn = document.getElementById("themeToggle");
        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {
                btn.textContent = "☀️";
            } else {
                btn.textContent = "🌙";
            }
        });
    </script>
</body>
</html>

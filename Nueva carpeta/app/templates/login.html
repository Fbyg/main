<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>Login</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap");

        :root {
            --bg: radial-gradient(circle at top, #1f335f, #000000);
            --text: #ffffff;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
        }

        body.light {
            --bg: radial-gradient(circle at top, #f5f1e8, #727272);
            --text: #111111;
            --card: #ffffff;
            --border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s ease;
        }

        .login-box {
            width: 380px;
            padding: 40px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
            color: var(--text);
        }

        .boton-elegante {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #474c58;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .boton-elegante:hover {
            background: #1d20d8;
            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;
            font-size: 12px;
            color: var(--text);
            opacity: 0.7;
        }

        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: 0.3s ease;
        }

        .theme-btn:hover {
            transform: scale(1.05);
        }

        ::selection {
            background: rgb(25, 0, 255);
            color: wheat;
        }
    </style>
</head>

<body>

    <button id="themeToggle" class="theme-btn">🌙</button>
    <div class="login-box">
        <h2>Iniciar sesión con Keycloak</h2>
        <button class="boton-elegante" onclick="window.location.href='/login'">Iniciar sesión</button>
    </div>
    <script>
        const btn = document.getElementById("themeToggle");
        btn.addEventListener("click", () => {
            document.body.classList.toggle("light");
            if (document.body.classList.contains("light")) {
                btn.textContent = "☀️";
            } else {
                btn.textContent = "🌙";
            }
        });
    </script>
</body>

</html>
